[tool.ruff]
# длина строки — стандарт 88 (как в black) или 120, выбирай что нравится
line-length = 100
# целевая версия Python — под неё ruff будет проверять синтаксис
target-version = "py311"
# какие папки исключить из проверки
exclude = [
    ".venv",
    "venv",
    "frontend",
    "migrations",
]

[tool.ruff.lint]
# наборы правил, которые включаем. каждая буква — группа проверок:
select = [
    "E",   # pycodestyle errors — ошибки стиля
    "W",   # pycodestyle warnings — предупреждения стиля
    "F",   # pyflakes — неиспользуемые импорты, переменные, потенциальные баги
    "I",   # isort — сортировка импортов
    "N",   # pep8-naming — правильные имена (классы CamelCase, функции snake_case)
    "UP",  # pyupgrade — подсказки по современному синтаксису Python
    "B",   # flake8-bugbear — частые источники багов
    "C4",  # flake8-comprehensions — улучшения списковых включений
    "SIM", # flake8-simplify — упрощение кода
]
# правила, которые игнорируем (можно дополнять по ходу)
ignore = []

[tool.ruff.format]
# использовать двойные кавычки как стандарт
quote-style = "double"

[tool.mypy]
# целевая версия Python
python_version = "3.11"
# показывать коды ошибок — удобно, чтобы понимать что за правило
show_error_codes = true
# красивый вывод с подсветкой проблемного места
pretty = true
# предупреждать о ненужных # type: ignore комментариях
warn_unused_ignores = true
# предупреждать, если функция что-то возвращает, но помечена как -> None
warn_return_any = true
# требовать аннотаций у определений функций
disallow_untyped_defs = false
# игнорировать отсутствие типов в сторонних библиотеках без заглушек
ignore_missing_imports = true

# какие папки исключить
exclude = [
    "frontend",
    ".venv",
    "venv",
    "migrations",
]

[tool.pytest.ini_options]
# где искать тесты
testpaths = ["tests"]
# файлы с тестами должны называться test_*.py
python_files = ["test_*.py"]
# функции-тесты должны начинаться с test_
python_functions = ["test_*"]
# удобный вывод: показывать какие тесты прошли/упали
addopts = "-v"

[tool.coverage.run]
source = ["domain", "adapters", "service_layer"]
omit = ["*/__init__.py", "*/tests/*"]
